{{ define "map" }}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.ID}} - Preview</title>
  <link href="{{.URL}}/map/static/index.css" rel="stylesheet" />
  <script src="{{.URL}}/map/static/index.js"></script>
  <style>
    body { margin:0; padding:0; }
    #map { position:absolute; top:0; bottom:0; width:100%; }
    
    /* Enhanced inspector panel styling */
    #info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      width: 300px;
      max-height: calc(100vh - 20px); /* Full height minus margins */
      overflow-y: auto;
      z-index: 999;
      display: none;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      line-height: 1.5;
    }
    #info-panel h4 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }
    #feature-properties strong {
      display: inline-block;
      width: 40%;
      margin-right: 5px;
      vertical-align: top;
    }
    .layer-name {
      font-weight: bold;
      margin-top: 10px;
      color: #0078A8;
      border-top: 1px solid #eee;
      padding-top: 5px;
    }
    .maplibregl-ctrl-attrib {
      font-size: 11px;
    }
    .leaflet-control-layers-toggle {
      width: 36px;
      height: 36px;
    }
  </style>
</head>
<body>
  <h1 style="display:none;">{{.ID}}</h1>
  <div id='map'></div>
  <div id="info-panel">
    <h4>Feature Properties</h4>
    <div id="feature-properties"></div>
  </div>
  <script>
    // Load raw JSON directly from template
    const tileJSON = {{.TileJSON}};
    const basemapStyleURL = {{.BasemapStyleURL}};
    const basemapTilesURL = {{.BasemapTilesURL}};

    // Overture Maps PMTiles basemap, used when the server was started without
    // -basemap-style-url or -basemap-tiles-url, so previews still get
    // geographic context without an external basemap provider or API key.
    // Cartography comes from the bundled overture-style.json; the archives
    // themselves are read straight from Overture's public tile host over HTTP
    // range requests, so nothing is proxied through this server.
    const OVERTURE_CATALOG_URL = "https://stac.overturemaps.org/catalog.json";
    // Only used if the STAC catalog cannot be read; the catalog is what
    // normally decides which release the preview draws.
    const OVERTURE_FALLBACK_RELEASE = "2026-08-19.0";
    // Themes referenced by the layers in overture-style.json.
    const OVERTURE_THEMES = ["base", "buildings", "divisions", "transportation"];
    const OVERTURE_ATTRIBUTION = '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap</a> <a href="https://docs.overturemaps.org/attribution" target="_blank">&copy; Overture Maps Foundation</a>';

    const useOvertureBasemap = !basemapStyleURL && !basemapTilesURL;

    function isWebglSupported() {
      if (window.WebGLRenderingContext) {
        const canvas = document.createElement('canvas');
        try {
          const context = canvas.getContext('webgl2') || canvas.getContext('webgl');
          if (context && typeof context.getParameter == 'function') {
            return true;
          }
        } catch (e) {
          // WebGL is supported, but disabled
        }
        return false;
      }
      // WebGL not supported
      return false;
    }

    // Always use vector rendering for TileJSON with vector_layers
    const useVector = tileJSON.vector_layers || isWebglSupported();

    let center = tileJSON.center;
    let zoom = tileJSON.minzoom || 0;

    if (tileJSON.bounds) {
      const { offsetWidth: width, offsetHeight: height } = document.querySelector('#map');
      const viewport = geoViewport.viewport(
        tileJSON.bounds,
        [width, height],
        undefined,
        undefined,
        undefined,
        true
      );
      center = viewport.center;
      zoom = Math.max(viewport.zoom - 1, zoom);
    }

    // The map waits on the STAC lookup before drawing, so a stalled request must
    // not hold it indefinitely; a timeout rejects like any other failure and
    // the pinned release is used instead.
    const OVERTURE_CATALOG_TIMEOUT_MS = 4000;

    async function fetchJSON(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), OVERTURE_CATALOG_TIMEOUT_MS);
      try {
        // The timeout covers reading the body too, not just the headers.
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) {
          throw new Error(url + " responded with " + response.status);
        }
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // Walks the Overture STAC catalog (root -> latest release -> theme) to find
    // the PMTiles archive published for each theme. Anything that cannot be
    // resolved falls back to the pinned release so the basemap still draws.
    async function resolveOverturePMTiles() {
      const fallbackURL = function(theme) {
        return "https://tiles.overturemaps.org/" + OVERTURE_FALLBACK_RELEASE + "/" + theme + ".pmtiles";
      };

      let releaseURL;
      let releaseCatalog;
      try {
        const rootCatalog = await fetchJSON(OVERTURE_CATALOG_URL);
        const rootLinks = rootCatalog.links || [];
        const releaseLink = rootLinks.find(link => link.rel === "child" && link.latest)
          || rootLinks.find(link => link.rel === "child" && rootCatalog.latest && link.href.indexOf(rootCatalog.latest) !== -1);
        if (!releaseLink) {
          throw new Error("no latest release link in " + OVERTURE_CATALOG_URL);
        }
        releaseURL = new URL(releaseLink.href, OVERTURE_CATALOG_URL).href;
        releaseCatalog = await fetchJSON(releaseURL);
      } catch (err) {
        console.warn("Overture STAC catalog unavailable, falling back to release " + OVERTURE_FALLBACK_RELEASE, err);
        return Object.fromEntries(OVERTURE_THEMES.map(theme => [theme, fallbackURL(theme)]));
      }

      const entries = await Promise.all(OVERTURE_THEMES.map(async function(theme) {
        try {
          const themeLink = (releaseCatalog.links || [])
            .find(link => link.rel === "child" && link.title === theme);
          if (!themeLink) {
            throw new Error("release " + releaseCatalog.id + " has no " + theme + " theme");
          }
          const themeURL = new URL(themeLink.href, releaseURL).href;
          const themeCatalog = await fetchJSON(themeURL);
          const pmtilesLink = (themeCatalog.links || []).find(link => link.rel === "pmtiles");
          if (!pmtilesLink) {
            throw new Error("no pmtiles link in " + themeURL);
          }
          return [theme, new URL(pmtilesLink.href, themeURL).href];
        } catch (err) {
          console.warn("Unable to resolve Overture " + theme + " PMTiles, falling back to release " + OVERTURE_FALLBACK_RELEASE, err);
          return [theme, fallbackURL(theme)];
        }
      }));

      return Object.fromEntries(entries);
    }

    // Builds the Overture basemap from the bundled style, one PMTiles vector
    // source per theme. Label layers are returned separately so they can be
    // drawn above the tileset overlay instead of underneath it.
    function overtureBasemap(pmtilesURLs) {
      const sources = {};

      OVERTURE_THEMES.forEach(function(theme) {
        const source = {
          type: "vector",
          url: "pmtiles://" + pmtilesURLs[theme]
        };
        // Credit the whole basemap once; every theme shares the same terms, and
        // MapLibre would otherwise repeat the attribution for each source.
        if (theme === "base") {
          source.attribution = OVERTURE_ATTRIBUTION;
        }
        sources[theme] = source;
      });

      return {
        sources,
        base: overtureStyle.layers.filter(layer => layer.type !== "symbol"),
        labels: overtureStyle.layers.filter(layer => layer.type === "symbol")
      };
    }

    let map;

    if (useVector) {
      initVectorMap().catch(err => console.error("Unable to initialize map", err));
    } else {
      initLeafletMap();
    }

    async function initVectorMap() {
      const sources = {};
      const layers = [];
      const labelLayers = [];
      const layersBySourceLayer = {};

      if (useOvertureBasemap) {
        maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
        const basemap = overtureBasemap(await resolveOverturePMTiles());
        Object.assign(sources, basemap.sources);
        layers.push(...basemap.base);
        labelLayers.push(...basemap.labels);
      }

      if (basemapTilesURL) {
        sources.basemap = {
          type: "raster",
          tiles: [basemapTilesURL]
        }
        layers.push({
          id: "basemap",
          source: "basemap",
          type: "raster"
        })
      }

      if (tileJSON.vector_layers) {
        sources.overlay= {
          type: "vector",
          attribution: tileJSON.attribution || '',
          tiles: tileJSON.tiles,
          minzoom: tileJSON.minzoom,
          maxzoom: tileJSON.maxzoom,
          tileSize: tileJSON.tilesize || 256
        }

        tileJSON.vector_layers.forEach(function(srcLyr, i) {
          // Track which layers correspond to which source layers
          if (!layersBySourceLayer[srcLyr.id]) {
            layersBySourceLayer[srcLyr.id] = [];
          }
          
          const polyLayerId = "overlay-poly-" + srcLyr.id;
          const lineLayerId = "overlay-line-" + srcLyr.id;
          const pointLayerId = "overlay-point-" + srcLyr.id;
          
          layersBySourceLayer[srcLyr.id].push(polyLayerId);
          layersBySourceLayer[srcLyr.id].push(lineLayerId);
          layersBySourceLayer[srcLyr.id].push(pointLayerId);
          
          layers.push({
            id: polyLayerId,
            source: "overlay",
            "source-layer": srcLyr.id,
            filter: ["==", "$type", "Polygon"],
            type: "fill",
            paint: {
              "fill-color": "rgba(0, 100, 180, 0.5)",
              "fill-opacity": 0.5,
              "fill-outline-color": "rgba(0, 0, 0, 1)"
            }
          });

          layers.push({
            id: lineLayerId,
            source: "overlay",
            "source-layer": srcLyr.id,
            filter: ["==", "$type", "LineString"],
            type: "line",
            paint: {
              "line-color": "rgba(0, 100, 180, 0.8)",
              "line-opacity": 0.75,
              "line-width": 2
            }
          });

          layers.push({
            id: pointLayerId,
            source: "overlay",
            "source-layer": srcLyr.id,
            filter: ["==", "$type", "Point"],
            type: "circle",
            paint: {
              "circle-radius": 5,
              "circle-color": "rgba(0, 100, 180, 0.8)",
              "circle-opacity": 0.8
            }
          });
        });
      } else {
        sources.overlay = {
          type: "raster",
          attribution: tileJSON.attribution || '',
          tiles: tileJSON.tiles,
          minzoom: tileJSON.minzoom,
          maxzoom: tileJSON.maxzoom
        }

        layers.push({
          id: "overlay-raster",
          source: "overlay",
          type: "raster"
        })
      }

      // Basemap labels go on top of the overlay so place and road names stay
      // readable through it.
      layers.push(...labelLayers);

      const style = basemapStyleURL || {
        version: 8,
        glyphs: overtureStyle.glyphs,
        sources,
        layers
      }

      map = new maplibregl.Map({
        container: "map",
        style,
        minZoom: tileJSON.minzoom,
        maxZoom: tileJSON.maxzoom,
        center,
        zoom,
        hash: true
      });
      
      map.addControl(new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
      }));

      map.on('load', () => {
        // Add the sources and layers manually if using a basemap style
        if (basemapStyleURL) {
          Object.entries(sources).map(([id, source])=> {
            map.addSource(id, source)
          });

          layers.forEach(layer => {
            map.addLayer(layer)
          });
        }
        
        // Add hover identification for vector layers
        if (tileJSON.vector_layers) {
          // Get all layer IDs for identification
          const identifyLayers = layers
            .filter(layer => layer.source === "overlay")
            .map(layer => layer.id);

          const infoPanel = document.getElementById('info-panel');
          const featureProperties = document.getElementById('feature-properties');
          
          // Function to display features from all layers
          function displayFeatures(point) {
            // Get all features from all vector layers at the point
            let foundFeatures = false;
            let html = '';
            
            // Group features by source layer
            const featuresBySourceLayer = {};
            
            // Query each source layer separately to ensure we get features from all layers
            for (const sourceLayerId in layersBySourceLayer) {
              const layerIds = layersBySourceLayer[sourceLayerId];
              const features = map.queryRenderedFeatures(point, { layers: layerIds });
              
              if (features.length > 0) {
                foundFeatures = true;
                featuresBySourceLayer[sourceLayerId] = features;
              }
            }
            
            // Display features from each source layer
            if (foundFeatures) {
              for (const sourceLayerId in featuresBySourceLayer) {
                const features = featuresBySourceLayer[sourceLayerId];
                
                // Add source layer heading
                html += `<div class="layer-name">${sourceLayerId}</div>`;
                
                // Show the first feature from this layer
                const feature = features[0];
                for (const key in feature.properties) {
                  if (feature.properties[key] !== null && feature.properties[key] !== undefined) {
                    html += `<strong>${key}:</strong> ${feature.properties[key]}<br>`;
                  }
                }
              }
              
              featureProperties.innerHTML = html;
              infoPanel.style.display = 'block';
            } else {
              infoPanel.style.display = 'none';
            }
          }
          
          // Set up mousemove handler for hover identification
          map.on('mousemove', (e) => {
            displayFeatures(e.point);
          });
          
          // Handle cursor change for all identify layers
          identifyLayers.forEach(layerId => {
            map.on('mouseenter', layerId, () => {
              map.getCanvas().style.cursor = 'pointer';
            });
            
            map.on('mouseleave', layerId, () => {
              map.getCanvas().style.cursor = '';
            });
          });
          
          // Hide info panel when mouse leaves the map
          map.getCanvas().addEventListener('mouseleave', () => {
            infoPanel.style.display = 'none';
          });
        }
      });
    }

    // Leaflet-based fallback rendering for browsers without WebGL
    function initLeafletMap() {
      map = L.map('map', { minZoom: 1, zoomControl: false });
      new L.Control.Zoom({ position: 'topright' }).addTo(map);
      
      var tile_urls = tileJSON.tiles || [];
      var tile_attribution = tileJSON.attribution || '';
      var tile_minzoom = tileJSON.minzoom || 0;
      var tile_maxzoom = tileJSON.maxzoom || 18;
      
      for (var i = 0; i < tile_urls.length; i++) {
        L.tileLayer(tile_urls[i], {
          tileSize: 512,
          zoomOffset: -1,
          minZoom: tile_minzoom,
          maxZoom: tile_maxzoom,
          attribution: tile_attribution
        }).addTo(map);
      }
      
      map.setView(center, zoom);
      
      // Enable URL hash for leaflet too
      setTimeout(function() {
        new L.Hash(map);
      }, 0);
    }
  </script>
</body>
</html>
{{ end }}
